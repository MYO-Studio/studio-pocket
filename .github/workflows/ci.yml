# Checks every push to main and every pull request: the TypeScript packages, the player's unit
# tests and lint, the e2fsprogs and mtkclient bundles with their release gates, the licence
# headers and the public-tree hygiene scan. No secrets: nothing here signs or publishes anything.
# Releases come from release.yml (v* tags).
#
# Every action is pinned to a full commit SHA; the tag it was resolved from is in the comment.
name: ci
on:
  push:
    branches: [main, develop]
  pull_request:
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0 (pnpm version from package.json's packageManager)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm }
      - run: sudo apt-get update && sudo apt-get install -y e2fsprogs   # firmware-tools' image tests call debugfs/mke2fs
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build && pnpm -r typecheck && pnpm -r test

  # Unit tests and lint only. No assembleRelease: without the release key the build would be
  # debug-signed (and the Gradle guard refuses it); a pull request never needs a signed APK.
  player-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults: { run: { working-directory: apps/player } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with: { packages: platform-tools }   # the default list names 'tools', which sdkmanager no longer has
      - run: ./gradlew --no-daemon testReleaseUnitTest lintRelease

  # debugfs/e2fsck/dumpe2fs: built from the pinned upstream tarball on macOS and Linux (hash
  # checked, OS-only libraries, smoke test); on Windows collected from Cygwin's package with its DLLs.
  e2fsprogs:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, bundle: linux }
          - { os: macos-latest, bundle: macos }
          - { os: windows-latest, bundle: windows }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults: { run: { shell: bash } }
    env:
      E2FS_BUNDLE_DIR: build/e2fsprogs/${{ matrix.bundle }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - if: runner.os == 'Windows'
        uses: cygwin/cygwin-install-action@006ad0b0946ca6d0a3ea2d4437677fa767392401 # v4
        with: { packages: e2fsprogs, add-to-path: false }
      - if: runner.os != 'Windows'
        run: OUT_DIR="$E2FS_BUNDLE_DIR" scripts/build-e2fsprogs.sh
      - if: runner.os == 'Windows'
        run: OUT_DIR="$E2FS_BUNDLE_DIR" scripts/build-e2fsprogs-windows.sh
      - run: node scripts/check-e2fsprogs-bundle.mjs   # the release gate
      - run: cat "$E2FS_BUNDLE_DIR/BUNDLE-INFO.json"

  # mtkclient: hash-locked dependencies, mtkclient from the checksummed commit archive, the MYO
  # Pocket patches and the licence texts. build-mtkclient.sh runs scripts/setup-mtkclient-venv.sh
  # itself (a fresh venv from the lock) before bundling, so the venv is not set up separately here.
  mtkclient:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults: { run: { shell: bash } }
    env:
      MTK_BUNDLE_DIR: build/mtkclient
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      - if: runner.os == 'macOS'
        run: brew install libusb   # bundled by PyInstaller; its LGPL text is copied into licences/
      - name: mtkclient bundle (sets up the locked venv first)
        env:
          # python3 can resolve to the Microsoft Store stub on Windows; elsewhere the script picks python3.
          PYTHON: ${{ runner.os == 'Windows' && 'python' || '' }}
        run: OUT_DIR="$MTK_BUNDLE_DIR" scripts/build-mtkclient.sh
      - name: mtkclient release gate (runs the bundled mtk as the capability probe)
        run: node scripts/check-mtkclient-bundle.mjs
      - run: cat "$MTK_BUNDLE_DIR/BUNDLE-INFO.json"

  headers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: node scripts/add-headers.mjs . --check

  # Forbidden paths and words, large files, and secrets (gitleaks on the working tree, not history).
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITLEAKS_VERSION: 8.30.1
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz (from the release's checksums file, re-hashed locally).
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - name: Install gitleaks (pinned version and hash)
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -fsSL -o "$tmp/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $tmp/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$tmp/gitleaks.tar.gz" -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: gitleaks version
      - run: bash scripts/check-public-hygiene.sh .
